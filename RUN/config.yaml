run_mode: DRY_RUN
exchange:
  name: binance
  market_type: future
  portfolio_margin: true
  timeout_ms: 30000
  rate_limit: true
  max_retries: 3
  retry_delay_base_ms: 1000
strategy:
  timeframe: 4h
  warmup_candles: 1200
  sma_regime_period: 150
  bull_leverage: 1.0
  bear_short_hedge_weight: 0.0
  cash_apr: 0.0
  assets:
    BTC:
      weight: 0.4
      pair: BTC/USDT
    ETH:
      weight: 0.3
      pair: ETH/USDT
    SOL:
      weight: 0.3
      pair: SOL/USDT
risk:
  max_orders_per_cycle: 6
  max_single_order_usd: 10000
  max_portfolio_change_pct: 0.2
  min_seconds_between_orders: 10
  allowed_symbols:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT
  banned_symbols: []
  allow_market_orders: true
  kill_switch: false
  max_drawdown_pct: 0.6
  min_order_value_usd: 11.0
state:
  backend: json
  path: data/bot_state.json
logging:
  level: INFO
  file: logs/bot.log
scheduler:
  poll_interval_seconds: 300
  max_consecutive_errors: 10
dry_run:
  initial_balances:
    USDT: 421.14769317
    BTC: 0.0148827
    ETH: 0.5506405
    SOL: 0.0
